<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suscripciones | Promoinvest SAF</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="logo">Promoinvest SAF</div>
      <nav>
        <a href="dashboard.html">Inicio</a>
        <a href="clientes.html">Clientes</a>
        <a href="valor-cuota.html">Valor cuota</a>
        <a href="suscripciones.html">Suscripciones</a>
        <a href="rescates.html">Rescates</a>
        <button id="logoutButton" class="logout-button" type="button">Cerrar sesión</button>
      </nav>
    </header>

    <main class="dashboard">
      <section class="panel">
        <h3>Buscar cliente por DNI</h3>
        <form id="buscarClienteForm" class="cliente-form">
          <div class="form-grid">
            <div>
              <label for="buscarDni">DNI</label>
              <input id="buscarDni" type="text" inputmode="numeric" pattern="[0-9]{8,20}" maxlength="20" required />
            </div>
          </div>
          <button type="submit">Buscar cliente</button>
        </form>
        <div id="buscarMessage" class="message"></div>
      </section>

      <section id="clienteConfirmacion" class="panel" hidden>
        <h3>Confirmar cliente</h3>
        <div class="client-summary">
          <p><strong>DNI:</strong> <span id="confirmacionDni"></span></p>
          <p><strong>Nombre:</strong> <span id="confirmacionNombre"></span></p>
          <p><strong>Apellidos:</strong> <span id="confirmacionApellidos"></span></p>
          <p><strong>Correo:</strong> <span id="confirmacionCorreo"></span></p>
          <p><strong>Saldo de cuotas:</strong> <span id="confirmacionSaldoCuotas"></span></p>
        </div>

        <form id="suscripcionForm" class="cliente-form">
          <input id="suscripcionClienteId" type="hidden" />
          <div class="form-grid">
            <div>
              <label for="suscripcionFecha">Fecha</label>
              <input id="suscripcionFecha" type="date" readonly required />
            </div>
            <div>
              <label for="suscripcionCuotas">Número de cuotas</label>
              <input id="suscripcionCuotas" type="number" min="1" required />
            </div>
            <div>
              <label for="suscripcionValor">Valor cuota del día anterior</label>
              <input id="suscripcionValor" type="text" readonly />
            </div>
            <div>
              <label for="suscripcionImporte">Importe total</label>
              <input id="suscripcionImporte" type="text" readonly />
            </div>
          </div>
          <button type="submit">Registrar suscripción</button>
        </form>
        <div id="suscripcionMessage" class="message"></div>
      </section>
    </main>

    <script src="js/suscripciones.js"></script>
    <script src="js/logout.js"></script>
  </body>
</html>
